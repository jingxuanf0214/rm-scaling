# the prime config will override default ppo_trainer.yaml

hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

data:
  filter_accuracy: True
  accuracy_lower_bound: 0.2
  accuracy_upper_bound: 0.8
  oversample_factor: 1.0 # Sample more responses than the batch size. prompts satisfying the filter will be prioritized.
  filter_truncate: False
  prompt_truncation: left     # 'left' (keep end), 'right' (keep start), 'error' (raise exception)
  response_truncation: right  # 'left' (keep end), 'right' (keep start), 'error' (raise exception)
  reward_model_enable_train: True

actor_rollout_ref:
  hybrid_engine: True
  model:
    use_remove_padding: True
  rollout:
    # number of responses (i.e. num sample times)
    n: 1
  actor:
    entropy_coeff: 0.001

reward_model:
  enable: True
  enable_train: True
  strategy: fsdp
  model:
    # If True, treat `reward_model.model.path` as a fully-trained RM HF checkpoint directory
    # and require a strict load (no missing/unexpected keys).
    # If False, treat `reward_model.model.path` as a base LM checkpoint and allow the RM head
    # to be randomly initialized (missing head weights are expected).
    start_from_rm: False
    ref_path: ${reward_model.model.path}
    use_remove_padding:  True
    tokenizer_path: ${actor_rollout_ref.model.path}
    enable_gradient_checkpointing: ${actor_rollout_ref.model.enable_gradient_checkpointing}
    ref_type: freeze
    save_initial_checkpoint: True  # Enable saving initial checkpoint after model initialization
    initial_checkpoint_path: checkpoints/${trainer.project_name}/${trainer.experiment_name}/initial_checkpoint
    seed: 42  # Random seed for reproducible model initialization
    fsdp_config:
      min_num_params: 0
      param_offload: ${actor_rollout_ref.actor.fsdp_config.param_offload}
#      grad_offload: ${actor_rollout_ref.actor.fsdp_config.grad_offload}
      optimizer_offload: ${actor_rollout_ref.actor.fsdp_config.optimizer_offload}
    update: after # ``before`` for double-forward, ``after`` for single-forward
    optim:
      lr: 1e-6
      lr_warmup_steps: -1 # Prioritized. Negative values mean delegating to lr_warmup_steps_ratio.
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: 0.1   # minimum learning rate ratio for cosine scheduling
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be overridden by program
      weight_decay: 0.01
      grad_clip: 10.0
    beta_train: 0.05
    loss_type: bt # currently only supports ce loss
    margin: 0.0
    label_smoothing: 0.0
    centering_coeff: 0.0
  prime_granularity: token
  prime_norm: batch_norm # batch_norm or none. if set to none, the normalizer is beta_train
  mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  reward_manager: prime

algorithm:
  adv_estimator: rloo
  # now supports rloo. it treats different source of reward separately.
  kl_ctrl:
    type: fixed
    kl_coef: 0.000
  reward_gt_coef: 5
  reward_dpo_coef: 5

trainer:
  project_name: prime
  experiment_name: examples
  val_before_train: False
  balance_batch: False
  enable_actor: False
  freeze_actor: True
  save_actor: False
  freeze_generation: True  # When True, skips actor generation and uses existing responses
  validate_only: False
  resume_from_path: null
